<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b1622;--navy-2:#13233a;--blue:#1f8fe6;--blue-soft:#e6f2fc;--ink:#111418;--muted:#5c6675;--bg:#f5f8fc;--card:#ffffff;--line:#e2e8f1;--accent:var(--blue);}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;letter-spacing:-0.02em;}
  a{color:var(--blue);text-decoration:none;}
  a:hover{color:var(--navy);}
  img{display:block;max-width:100%;}
  .g-item{border-radius:16px;overflow:hidden;box-shadow:0 22px 46px -34px rgba(14,33,64,0.4);background:var(--card);border:1px solid var(--line);}
  .g-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;cursor:zoom-in;}
  .g-item:hover img{transform:scale(1.05);}
  @keyframes lbfade{from{opacity:0;}to{opacity:1;}}
  @media(max-width:760px){
    .gp-grid{grid-template-columns:1fr !important;}
    .gp-grid > .span2{grid-column:auto !important;}
    .g-all{grid-template-columns:1fr 1fr !important;}
  }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">

  <header style="position:sticky;top:0;z-index:60;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)">
    <div style="max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <a href="index.html" style="display:flex;align-items:center;gap:10px"><img src="uploads/logo-renipro.png" alt="Auto škola Reni Pro" style="height:44px;width:auto"></a>
    </div>
  </header>

  <section style="background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;overflow:hidden;position:relative">
    <div style="position:absolute;top:-20%;right:-6%;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(31,143,230,0.32),transparent 68%);filter:blur(20px)"></div>
    <div style="position:relative;max-width:1200px;margin:0 auto;padding:70px 24px 44px">
      <div style="color:#7fc0f5;font-weight:700;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px">Galerija</div>
      <h1 style="font-size:clamp(32px,5vw,54px);line-height:1.05">Naša škola u slikama</h1>
      <p style="font-size:clamp(16px,2vw,19px);color:rgba(255,255,255,0.82);max-width:620px;margin-top:16px;line-height:1.6">Pogledajte naš vozni park i atmosferu iz auto škole Reni Pro.</p>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:70px 24px 40px;width:100%">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:26px">
      <span style="width:9px;height:9px;border-radius:50%;background:var(--accent)"></span>
      <h2 style="font-size:clamp(24px,3vw,34px);color:var(--navy)">Naš vozni park</h2>
    </div>
    <div class="gp-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
      <div class="g-item span2" style="grid-column:span 2;grid-row:span 2"><img src="uploads/pasted-1785484004114-0.png" alt="Tim i vozni park Reni Pro" onClick="{{ open0 }}"></div>
      <div class="g-item" style="aspect-ratio:4/3"><img src="uploads/pasted-1785482521818-0.png" alt="Renault Clio flota" onClick="{{ open1 }}"></div>
      <div class="g-item" style="aspect-ratio:4/3"><img src="uploads/pasted-1785482515229-0.png" alt="Teretno vozilo Mercedes Atego" onClick="{{ open2 }}"></div>
      <div class="g-item" style="aspect-ratio:4/3"><img src="uploads/pasted-1785482527366-0.png" alt="Autobus Royal Class" onClick="{{ open3 }}"></div>
      <div class="g-item" style="aspect-ratio:4/3"><img src="uploads/pasted-1785482532608-0.png" alt="Traktor sa prikolicom" onClick="{{ open4 }}"></div>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:20px 24px 90px;width:100%;flex:1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:26px">
      <span style="width:9px;height:9px;border-radius:50%;background:var(--accent)"></span>
      <h2 style="font-size:clamp(24px,3vw,34px);color:var(--navy)">Iz naše škole</h2>
    </div>
    <div class="g-all" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;grid-auto-rows:1fr">
      <sc-for list="{{ photos }}" as="p" hint-placeholder-count="9">
        <div class="g-item" style="aspect-ratio:4/3">
          <img src="{{ p.img }}" alt="Iz auto škole Reni Pro" onClick="{{ p.onOpen }}">
        </div>
      </sc-for>
    </div>
    <p style="color:var(--muted);font-size:14px;margin-top:20px">* Prevucite fotografije u ova polja ili mi pošaljite slike da ih ubacim.</p>
    <div style="text-align:center;margin-top:40px">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);color:var(--ink);padding:14px 30px;border-radius:999px;font-weight:700;font-size:16px;background:#fff" style-hover="border-color:var(--accent);color:var(--accent)">← Nazad na početnu</a>
    </div>
  </section>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;z-index:200;background:rgba(6,12,22,0.92);display:flex;align-items:center;justify-content:center;padding:24px;animation:lbfade .2s ease">
      <button onClick="{{ closeLightbox }}" aria-label="Zatvori" style="position:absolute;top:20px;right:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2">×</button>
      <button onClick="{{ lbPrev }}" aria-label="Prethodna" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <img src="{{ lightboxSrc }}" onClick="{{ stopLb }}" alt="Galerija" style="max-width:88vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 40px 90px -30px rgba(0,0,0,0.7)">
      <button onClick="{{ lbNext }}" aria-label="Sledeća" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
  </sc-if>

  <footer style="background:var(--navy);border-top:1px solid rgba(255,255,255,0.08);padding:36px 24px">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between">
      <img src="uploads/logo-renipro.png" alt="Auto škola Reni Pro" style="height:44px;background:#fff;padding:6px 10px;border-radius:10px">
      <div style="color:rgba(255,255,255,0.6);font-size:14px">© 2026 Auto škola Reni Pro · Vršac</div>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lbIndex: -1 };
  parkImgs = [
    'uploads/pasted-1785484004114-0.png',
    'uploads/pasted-1785482521818-0.png',
    'uploads/pasted-1785482515229-0.png',
    'uploads/pasted-1785482527366-0.png',
    'uploads/pasted-1785482532608-0.png',
  ];
  photos = [
    'uploads/pasted-1785757962073-0.png',
    'uploads/pasted-1785757969633-0.png',
    'uploads/pasted-1785757975603-0.png',
    'uploads/pasted-1785757980897-0.png',
    'uploads/pasted-1785757985664-0.png',
    'uploads/pasted-1785757996194-0.png',
    'uploads/pasted-1785758001359-0.png',
    'uploads/pasted-1785758011232-0.png',
    'uploads/pasted-1785758026013-0.png',
  ];
  all() { return this.parkImgs.concat(this.photos); }
  open(i) { this.setState({ lbIndex: i }); }
  step(d) {
    const n = this.all().length;
    this.setState(s => ({ lbIndex: (s.lbIndex + d + n) % n }));
  }
  renderVals() {
    const parkN = this.parkImgs.length;
    return {
      photos: this.photos.map((img, i) => ({ img, onOpen: () => this.open(parkN + i) })),
      open0: () => this.open(0),
      open1: () => this.open(1),
      open2: () => this.open(2),
      open3: () => this.open(3),
      open4: () => this.open(4),
      lightboxOpen: this.state.lbIndex >= 0,
      lightboxSrc: this.state.lbIndex >= 0 ? this.all()[this.state.lbIndex] : '',
      lbPrev: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.step(-1); },
      lbNext: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.step(1); },
      closeLightbox: () => this.setState({ lbIndex: -1 }),
      stopLb: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
    };
  }
}
</script>
</body>
</html>
